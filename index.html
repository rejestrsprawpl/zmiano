<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zmiano · grafik pracy dla gastronomii</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f6f4ef;--ink:#1d2621;--muted:#66706a;--accent:#e2674a;--line:#dcd9d0}
@media (prefers-color-scheme:dark){:root{--bg:#141a17;--ink:#e9ece7;--muted:#9aa49d;--accent:#f08a6f;--line:#33403a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans",system-ui,sans-serif;padding:32px max(20px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:"Familjen Grotesk",system-ui,sans-serif;font-size:clamp(40px,9vw,64px);line-height:1;margin:0;letter-spacing:-.02em}
h1 span{color:var(--accent)}
p{margin:0;color:var(--muted);max-width:46ch}
.lead{font-size:20px;color:var(--ink)}
.c{border-top:1px solid var(--line);padding-top:18px;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>zmiano<span>.</span></h1>
  <p class="lead">Grafik pracy dla restauracji, który układa się sam.</p>
  <p>Pracownicy wpisują, kiedy mogą pracować. Ty ustawiasz zasady lokalu. Zmiano dobiera obsadę na cały miesiąc: kuchnię, salę i dowóz.</p>
  <p class="c">Wkrótce. Kontakt: kontakt@zmiano.pl</p>
</main>
</body>
</html>
