# Po każdym pushu na main: testy bezpieczeństwa, potem wysyłka na OVH szyfrowanym FTPS.
# Dane logowania są w Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Pliki z PIN-ami (*/config.php) i dane lokali (*/data/) nie są w repo
# i nie są ruszane na serwerze.
name: Wdrożenie na OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Testy bezpieczeństwa (wdrożenie zatrzyma się, jeśli coś nie przejdzie)
        run: bash tests/security.sh

      - name: Wyślij pliki na OVH
        id: ftp1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          server-dir: zmiano/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/data/**
            README.md
            COPYRIGHT.md
            tests/**

      - name: Druga próba, jeśli OVH nie odpowiedział
        if: steps.ftp1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          timeout: 120000
          server-dir: zmiano/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/data/**
            README.md
            COPYRIGHT.md
            tests/**
