# Po każdym pushu na main wysyła stronę na hosting OVH przez FTP.
# Dane logowania są w Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Pliki z PIN-ami (*/config.php) i dane lokali (*/data/) nie są w repo
# i nie są ruszane na serwerze.
name: Wdrożenie na OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wyślij pliki na OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: zmiano/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/data/**
            README.md
            COPYRIGHT.md
