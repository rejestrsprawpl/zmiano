# Po każdym pushu na main: testy bezpieczeństwa, potem wysyłka na OVH szyfrowanym SFTP (zapasowo FTP).
# Dane logowania są w Settings → Secrets and variables → Actions:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# Pliki z PIN-ami (*/config.php) i dane lokali (*/data/) nie są w repo
# i nie są ruszane na serwerze.
name: Wdrożenie na OVH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ovh
  cancel-in-progress: false

jobs:
  ftp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Testy bezpieczeństwa (wdrożenie zatrzyma się, jeśli coś nie przejdzie)
        run: bash tests/security.sh

      - name: Wyślij pliki na OVH szyfrowanym SFTP
        id: sftp
        continue-on-error: true
        env:
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          H: ${{ secrets.FTP_SERVER }}
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq lftp >/dev/null
          lftp -c "set sftp:auto-confirm yes; set net:max-retries 2; set net:timeout 30; \
            open -u \"$U\",\"$P\" sftp://${H/ftp./ssh.}; \
            mirror -R --verbose=1 --parallel=4 \
              --exclude-glob .git* --exclude '^\.git/' --exclude '^\.github/' --exclude '^tests/' \
              --exclude '(^|/)data/' --exclude '(^|/)config\.php$' --exclude '^README\.md$' --exclude '^COPYRIGHT\.md$' \
              ./ zmiano/"

      - name: Zapasowo zwykłe FTP (gdyby SFTP nie działało)
        if: steps.sftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          timeout: 120000
          server-dir: zmiano/
          exclude: |
            **/.git*
            **/.git*/**
            **/config.php
            **/data/**
            README.md
            COPYRIGHT.md
            tests/**
